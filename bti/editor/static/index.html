<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behind the Image</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/edit.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/script.css">
<link rel="stylesheet" href="css/voice.css">
<link rel="stylesheet" href="css/picks.css">
<link rel="stylesheet" href="css/export.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="shell">
  <header id="shell-top">
    <div id="frame-bar">
      <a class="brand" href="#/" title="Danh sách dự án">Behind the Image</a>
      <select id="project-pick" title="Chọn dự án"></select>
      <div id="frame-project"></div>
      <span class="grow"></span>
      <span id="frame-status" class="muted" role="status"></span>
      <button id="btn-new" class="primary small" title="Chọn một tác phẩm trong thư viện để làm video mới">+ Tạo video mới</button>
      <span id="health" class="badge" title="Tình trạng engine và media">...</span>
    </div>
    <nav id="stepper" aria-label="Các bước của dự án" hidden></nav>
    <div id="step-banner" role="status" hidden></div>
  </header>
  <main id="view"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
